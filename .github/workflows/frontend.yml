name: CI
on: [push, pull_request]

# A newer push to the same branch supersedes older runs: cancel them instead of
# letting stale runs wait for runners and then time out.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # One job on purpose: this account gets very few concurrent runners, and a second
  # job queued behind another run was cancelled by GitHub after 15 minutes waiting.
  ci:
    name: Build, tests and Electron end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate dependency lockfile
        run: node scripts/check-lockfile.mjs
      - name: System tools (FFmpeg, virtual display, TTS voice for the "Clip that" test)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb flite
      - run: npm ci
      - run: npm run typecheck
      - name: Renderer contract tests
        run: npm run test:renderer
      - name: Service tests (fake OBS server + real FFmpeg)
        run: npm run test:services
      - name: Build renderer and desktop bundles
        run: npm run build && npm run desktop:build
      - name: Fetch offline voice model (SHA-256 verified)
        run: npm run fetch:voice-model
      - name: Electron end-to-end (real app driven through the UI)
        env:
          DRIFT_E2E_SCREENSHOTS: e2e-screenshots
        run: xvfb-run -a node tests/electron-e2e/run.mjs
      - run: npx playwright install --with-deps chromium
      - name: Browser demo (layouts, focus, keyboard, dialogs)
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            e2e-screenshots/*.png
            docs/screenshots/*.png
            docs/browser-verification.json
          if-no-files-found: ignore
